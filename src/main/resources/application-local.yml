spring:
  thymeleaf:
    cache: false
    prefix: 'file:src/main/resources/templates/'
  web:
    resources:
      cache:
        period: 0
      chain:
        cache: false
      static-locations: 'file:src/main/resources/static/'
logging:
  level:
    '[org.springframework.jdbc.core.JdbcTemplate]': DEBUG
    '[org.springframework.jdbc.core.StatementCreatorUtils]': TRACE
