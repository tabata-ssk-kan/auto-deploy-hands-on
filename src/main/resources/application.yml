spring:
  application:
    name: demo
  datasource:
    url: jdbc:sqlite:./app.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: >
        PRAGMA journal_mode = WAL;
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
