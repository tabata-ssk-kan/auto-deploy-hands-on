<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="header">
                <a href="/" th:href="@{/}" class="link-reset"><span class="site-title">QuickTools-Web</span></a>
            </div>
            <nav class="nav-bar" aria-label="ナビゲーション">
                <a href="/" th:href="@{/}" class="nav-menu" aria-current="page">トップページ</a>
            </nav>
        </header>
        <main>
            <section class="common-container center" style="margin-top: 4rem;">
                <h1 class="page-title">500 Internal Server Error</h1>
                <p th:text="${message != null ? message : '処理を完了できませんでした。'}">処理を完了できませんでした。</p>
                <hr>
                <div class="button-row" style="justify-content: center;">
                    <a href="/" th:href="@{/}" class="btn-primary">トップへ戻る</a>
                </div>
            </section>
        </main>
        <footer><div><hr><p class="center">2026 11/23 更新</p></div></footer>
    </div>
</body>
</html>
